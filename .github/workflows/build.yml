name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak project
        run: unzip -o PWFish.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: PWFish
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: PWFish-apk
          path: PWFish/app/build/outputs/apk/debug/app-debug.apk

      - name: Terbitkan di Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp PWFish/app/build/outputs/apk/debug/app-debug.apk PWFish.apk
          TAG=latest; [ "${{ github.ref_name }}" != "main" ] && TAG="${{ github.ref_name }}"
          gh release delete $TAG -y --cleanup-tag || true
          gh release create $TAG PWFish.apk --title "PW Fish (build terbaru)" --notes "APK hasil build otomatis dari commit ${{ github.sha }}"
